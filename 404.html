<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | Household Budget Optimizer</title>
  <meta name="description" content="This page doesn’t exist. Go back to the free, private household budget calculator.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    (function () {
      var d = document.documentElement, t = null;
      // Non-English visitors: hide the page until it's translated (max 2s), and set direction early
      var L = ['en', 'es', 'hi', 'ar', 'ur', 'fr', 'pt', 'id', 'de'], l = null;
      try { l = localStorage.getItem('hbo:lang'); } catch (e) {}
      if (L.indexOf(l) < 0) {
        l = 'en';
        var ls = navigator.languages || [navigator.language];
        for (var i = 0; i < ls.length; i++) { var b = String(ls[i] || '').toLowerCase().split('-')[0]; if (L.indexOf(b) > -1) { l = b; break; } }
      }
      if (l !== 'en') {
        d.classList.add('i18n-pending'); d.lang = l; if (l === 'ar' || l === 'ur') d.dir = 'rtl';
        setTimeout(function () { d.classList.remove('i18n-pending'); }, 2000);
      }
      try { t = localStorage.getItem('hbo:theme'); } catch (e) {}
      if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) d.classList.add('dark');
    })();
  </script>
</head>
<body>
<!--SITE_HEADER-->

  <main id="main" class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24">
    <div class="max-w-2xl">
      <p class="text-sm font-semibold tabular-nums text-emerald-700 dark:text-emerald-400">404</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl dark:text-white" data-i18n="notFound.title">We can’t find that page</h1>
      <p class="mt-3 text-lg leading-relaxed muted" data-i18n="notFound.lead">The link may be old or mistyped. Your budget is safe: it’s saved in this browser, not on this page.</p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a href="/#app" class="btn btn-primary px-5" data-i18n="notFound.calculator">Open the calculator</a>
        <a href="/#guide" class="btn btn-secondary" data-i18n="notFound.tips">Read the money tips</a>
      </div>
    </div>
  </main>

<!--SITE_FOOTER-->
  <div id="toastRegion" class="pointer-events-none fixed inset-x-0 bottom-6 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
  <script type="module" src="/src/page.js"></script>
</body>
</html>
